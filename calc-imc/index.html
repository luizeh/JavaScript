<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="imc-container">
      <header class="imc-header">
        <h1>📊 Calculadora de IMC</h1>
        <p>Descubra seu Índice de Massa Corporal</p>
      </header>

      <main class="imc-main">
        <section class="form-card">
          <h2>Dados Pessoais</h2>

          <form id="imcForm" onsubmit="calcularIMC(event)">
            <div class="form-group">
              <label for="peso">Peso (kg)</label>
              <input
                type="number"
                id="peso"
                name="peso"
                step="0.1"
                min="0"
                placeholder="Ex: 70"
                required
              />
            </div>

            <div class="form-group">
              <label for="altura">Altura (m)</label>
              <input
                type="number"
                id="altura"
                name="altura"
                step="0.01"
                min="0"
                max="3"
                placeholder="Ex: 1.75"
                required
              />
            </div>

            <button type="submit" class="btn">Calcular IMC</button>
          </form>
        </section>

        <section class="result-card" id="resultCard" style="display: none">
          <h2>Resultado</h2>

          <div class="result-box">
            <div class="result-value">
              <span id="resultIMC">--</span>
            </div>
            <div class="result-info">
              <p class="result-category" id="resultCategory"></p>
              <p class="result-description" id="resultDescription"></p>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-secondary"
            onclick="limparFormulario()"
          >
            Calcular Novamente
          </button>
        </section>
      </main>

      <footer class="imc-footer">
        <p>
          IMC é apenas uma referência • Consulte um médico para orientação
          completa
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
